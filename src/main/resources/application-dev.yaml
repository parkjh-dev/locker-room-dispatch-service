spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.mariadb.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
  security:
    oauth2:
      client:
        registration:
          dispatch-service:
            client-id: ${KEYCLOAK_CLIENT_ID}
            client-secret: ${KEYCLOAK_CLIENT_SECRET}
            authorization-grant-type: client_credentials
            provider: keycloak
        provider:
          keycloak:
            token-uri: ${KEYCLOAK_TOKEN_URI}

dispatch:
  sms:
    provider: gabia
    gabia:
      base-url: ${GABIA_SMS_BASE_URL:https://sms.gabia.com}
      api-id: ${GABIA_SMS_API_ID}
      api-key: ${GABIA_SMS_API_KEY}
      default-from: ${GABIA_SMS_FROM}
  mail:
    from: ${MAIL_FROM}

logging:
  level:
    com.lockerroom.dispatchservice: INFO
